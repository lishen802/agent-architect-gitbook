<title id="t">图 3-2 超时背后的时间差</title><desc id="d">应用发出创建工单请求，工单系统已经创建记录，响应在网络中丢失，应用只观察到超时；直接重试可能重复创建，直接判定失败会漏掉已建工单，应按操作标识查询后再决定。</desc>
