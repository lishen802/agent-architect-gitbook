<title id="t">图 2-1 从需求到方案的分层选型图</title><desc id="d">先明确任务与验收、比较无需模型的基线，再选择控制方式；信息获取、动作与授权、状态与恢复分别决定；最后形成一页方案并用最小实验验证，不满足时回到对应决策。</desc>
