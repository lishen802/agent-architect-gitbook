<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
<title id="t">图 7-1 工具执行边界</title><desc id="d">固定流程生成的请求与模型提出的调用进入同一条执行路径：参数检查、授权与预算检查、执行适配器调用、结果校验与过滤，最后形成证据或明确的失败信息。主体、租户、任务标识与截止时间由系统注入，模型不可填写。</desc>
