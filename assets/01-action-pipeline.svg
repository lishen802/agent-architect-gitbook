<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">图 1-3 动作执行流水线</title>
<desc id="desc">模型提议、系统校验、策略裁决、工具执行、结果核对依次进行；校验失败与策略拒绝转为结构化观察返回，需要审批时挂起，结果不明时先查询核对。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="700" fill="#f8fafc"/>
<text x="50" y="52" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="600" fill="#172b4d" text-anchor="start">动作执行流水线</text>
<text x="50" y="84" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#475569" text-anchor="start">图 1-3｜模型提议，系统校验，策略裁决，工具执行。每一关都可以拦下提议。</text>
<rect x="50" y="130" width="240" height="140" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="70" y="163" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">模型提议</text>
<text x="70" y="194" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">工具名、参数、理由</text>
<text x="70" y="222" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">只是候选，不是命令</text>
<rect x="312" y="130" width="240" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="332" y="163" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">系统校验</text>
<text x="332" y="194" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">工具存在、Schema</text>
<text x="332" y="222" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">资源标识、大小与时限</text>
<rect x="574" y="130" width="240" height="140" rx="12" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="594" y="163" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">策略裁决</text>
<text x="594" y="194" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">主体、资源、动作</text>
<text x="594" y="222" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">允许 / 拒绝 / 需审批</text>
<rect x="836" y="130" width="240" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="856" y="163" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">工具执行</text>
<text x="856" y="194" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">超时、幂等键</text>
<text x="856" y="222" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">审计、结果规范化</text>
<rect x="1098" y="130" width="240" height="140" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1118" y="163" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">结果核对</text>
<text x="1118" y="194" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">读取外部系统结果</text>
<text x="1118" y="222" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">写入任务状态</text>
<path d="M290,200 L308,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M552,200 L570,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M814,200 L832,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1076,200 L1094,200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M432,270 L432,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="312" y="384" width="240" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="332" y="417" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">校验失败</text>
<text x="332" y="448" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">转为结构化观察</text>
<text x="332" y="476" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">不把堆栈塞回上下文</text>
<path d="M660,270 L660,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="574" y="384" width="240" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="594" y="417" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">策略拒绝</text>
<text x="594" y="448" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">记录拒绝原因</text>
<text x="594" y="476" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">作为观察返回</text>
<path d="M740,270 L740,300 L930,300 L930,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="836" y="384" width="240" height="130" rx="12" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="856" y="417" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">需要审批</text>
<text x="856" y="448" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">保存状态并挂起</text>
<text x="856" y="476" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">批准绑定动作与参数</text>
<path d="M1218,270 L1218,380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1098" y="384" width="252" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1118" y="417" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#172b4d" text-anchor="start">结果不明</text>
<text x="1118" y="448" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">按操作标识查询</text>
<text x="1118" y="476" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#334155" text-anchor="start">确认前不盲目重试</text>
<path d="M432,514 L432,560 L170,560 L170,274" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="190" y="550" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">返回模型，进入下一轮或停止</text>
<path d="M694,514 L694,560 L436,560" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="50" y="630" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#475569" text-anchor="start">阅读提示：提示词中的约束不能替代第二、三关；即使模型提议了危险动作，也要有独立机制拦下。</text>
<text x="50" y="662" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" fill="#475569" text-anchor="start">审批与结果核对的详细设计见第 7、12 章。</text>
</svg>
