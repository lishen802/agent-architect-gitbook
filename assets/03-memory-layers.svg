<path d="M330,414.0 L516,414.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="30" y="464" width="940" height="50" rx="12" fill="#eaf2ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)"/>
<text x="48.0" y="494.6" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">只有任务状态中经过校验的事实，才能作为审批与执行的依据；其余三种都要按来源和时效重新核对</text>
