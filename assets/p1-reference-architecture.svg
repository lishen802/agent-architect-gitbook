<title id="t">图 P1-1 AI 应用参考架构</title><desc id="d">入口与身份之下是由代码负责的应用控制面；模型服务只经模型网关调用，知识检索经上下文组装按权限取用，工具执行器只在策略与授权放行后执行；评测与观测贯穿各层。</desc>
