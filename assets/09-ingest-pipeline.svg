<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="718" viewBox="0 0 1000 718" role="img" aria-labelledby="t d">
<title id="t">图 9-1 知识处理链路</title><desc id="d">手册库与复盘库的页面依次经过解析、切分和加元数据，写入倒排索引与向量索引，向量由同一嵌入模型生成；解析发现隐藏内容或异常字符时标为待审，不入库。源系统的变更事件驱动三类同步：内容更新按文档替换全部段落，权限变化同步到段落元数据，删除覆盖向量、缓存与评测样例，其中回答缓存与评测样例不在知识索引里，需另行清理；版本核对比较源系统与索引中的文档版本，发现滞后。</desc>
