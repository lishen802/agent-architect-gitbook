<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="t d">
<title id="t">图 14-1 知识客服的三阶段演进</title><desc id="d">阶段一为固定检索问答；阶段二在其上增加会话状态、澄清与转人工规则和人工交接；阶段三再增加按职责路由、业务查询接口、结构化草稿校验与确认后提交。每一阶段保留前一阶段的链路。</desc>
