<title id="t">图 8-3 记忆写入与读取的控制点</title><desc id="d">写入路径：用户陈述、权威系统记录、人工确认的结论和模型推断都先经过写入前系统校验，结果分为拒绝、待审、接受；待审条目也进入存储，但标为待审状态，确认前不可读取。模型推断最多进入待审。读取路径：范围取自认证上下文，只读可信、未过期的最新版本，作为带来源的数据进入预算分配。删除请求要同时清理摘要、索引、缓存等派生副本。</desc>
