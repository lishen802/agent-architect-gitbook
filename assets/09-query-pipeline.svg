<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="902" viewBox="0 0 1000 902" role="img" aria-labelledby="t d">
<title id="t">图 9-2 检索与回答链路</title><desc id="d">问题与认证上下文先确定服务、版本与用户组；在权限预过滤后并行运行 BM25 与向量检索，用 RRF 融合，可选地对前 N 个候选重排；证据适用性检查排除服务或版本不符的材料，没有适用证据时返回证据不足，不生成结论；模型生成带引用的陈述，引用核对检查段落、摘录与数字，未通过的陈述退回或标为待审。各步结果写入调用清单。</desc>
